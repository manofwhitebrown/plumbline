<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070a12" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Plumbline</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    /* Loading splash: pure CSS so the first paint is never white. */
    html, body { margin: 0; height: 100%; background: #070a12; color: #eef2ff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    #app { position: fixed; inset: 0; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: radial-gradient(ellipse at 50% 30%, #1d2740 0%, #0d1220 55%, #070a12 100%);
      transition: opacity .26s ease-out; z-index: 9999; }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash .line { width: 2px; height: 64px; background: linear-gradient(#f6c453, transparent); }
    #splash .weight { width: 22px; height: 22px; border-radius: 6px; background: #f6c453;
      box-shadow: 0 0 24px #f6c45399; animation: sway 1.6s ease-in-out infinite; transform-origin: 50% -64px; }
    #splash h1 { margin: 0; font-size: 28px; letter-spacing: .24em; font-weight: 700; color: #ffe3a1; }
    #splash p { margin: 0; font-size: 14px; color: #8d97b8; }
    @keyframes sway { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
    @media (prefers-reduced-motion: reduce) { #splash .weight { animation: none; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="splash" role="status" aria-live="polite">
    <div><div class="line"></div><div class="weight"></div></div>
    <h1>PLUMBLINE</h1>
    <p>Lowering the rope…</p>
  </div>
  <noscript>Plumbline needs JavaScript to run.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
