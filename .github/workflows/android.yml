name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build
      # Make the android folder only if it is missing.
      - name: Add Android project if missing
        run: '[ -d android ] || npx cap add android'
      - run: sudo apt-get install -y -q imagemagick || true
      - run: sh tools/android-assets.sh || true
      - run: npx cap sync android

      # ---- Debug APK on every push to main ----
      - name: Build debug APK
        working-directory: android
        run: |
          # If the Back button code ever fails to compile, fall back to the stock screen so the APK still builds.
          ./gradlew assembleDebug --no-daemon || {
            echo "::warning::Build failed with the Back button code. Retrying with the stock MainActivity."
            find app/src/main/java -name 'MainActivity.java.stock' | while read -r f; do cp "$f" "${f%.stock}"; done
            ./gradlew assembleDebug --no-daemon
          }
      - uses: actions/upload-artifact@v4
        with:
          name: plumbline-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Signed release APK on a tag like v0.1.0 ----
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Sign release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KEYSTORE_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out "plumbline-${GITHUB_REF_NAME}.apk" "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plumbline-*.apk
